name: 1. MacOS qt6.12.1 Universal cmake C/C++ CI

on:
  workflow_dispatch:
    inputs:
      yyyymmdd:
        description: 'Date string for release (yyyymmdd)'
        required: true
jobs:
  build:
    runs-on: xcode-27

    steps:
    # リポジトリをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # Qtをインストール
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.12.1
        modules: 'qtimageformats'
        extra: '--external 7z'

    - name: Clone CaptureStream2
      run: |
          git clone https://github.com/CSReviser/CaptureStream2.git
          cd CaptureStream2
          git checkout feature 
          git submodule update --init --recursive
#          cp ./Resources/icon.icns ./
#          cp ./Resources/icon.ico ./
#          cp ./Resources/icon.png ./
#          git checkout feature 

    # CMakeでビルド構成を生成
    - name: Configure CMake
      run: |
          mkdir build
          cmake -S CaptureStream2 -B build -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4

    # Makeでビルド
    - name: Build with Make
      run: cmake --build build --parallel

    - name: Prepare CaptureStream2 executable
      run: |
        wget -qO FFmpeg.tar.gz https://github.com/CSReviser/ffmpeg-build/releases/download/9.0.2/ffmpeg-macos-universal.tar.gz || { echo "Failed to download FFmpeg"; exit 1; }
        tar -xzvf FFmpeg.tar.gz ffmpeg
        cp ffmpeg ./build/CaptureStream2.app/Contents/MacOS/ 
        cp CaptureStream2/icon.icns ./build/CaptureStream2.app/Contents/Resources/
        cp CaptureStream2/qss_files/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/MacOS/
        cp CaptureStream2/qss_files/stylesheet-mac/red/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Red.qss
        cp CaptureStream2/qss_files/stylesheet-mac/green/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Green.qss
        cp CaptureStream2/qss_files/stylesheet-mac/blue/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Blue.qss
        cp CaptureStream2/qss_files/stylesheet-mac/brown/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Brown.qss
        cp CaptureStream2/qss_files/stylesheet-mac/indigo/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Indigo.qss
        cp CaptureStream2/qss_files/stylesheet-mac/purple/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Purple.qss
        cp CaptureStream2/qss_files/stylesheet-mac/yellow/stylesheet-mac.qss ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Yellow.qss
        cp CaptureStream2/Resources/icons/red/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Red.png
        cp CaptureStream2/Resources/icons/green/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Green.png
        cp CaptureStream2/Resources/icons/blue/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Blue.png
        cp CaptureStream2/Resources/icons/brown/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Brown.png
        cp CaptureStream2/Resources/icons/indigo/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Indigo.png
        cp CaptureStream2/Resources/icons/purple/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Purple.png
        cp CaptureStream2/Resources/icons/yellow/icon.png ./build/CaptureStream2.app/Contents/Resources/CaptureStream2-Yellow.png

        
#        wget -qO ffmpeg8arm.zip https://www.osxexperts.net/ffmpeg81arm.zip
#        wget -qO FFmpeg.tar.gz https://github.com/CSReviser/ffmpeg-build/releases/download/8.0/ffmpeg-macos-universal.tar.gz || { echo "Failed to download FFmpeg"; exit 1; }
#        wget -qO FFmpeg.tar.gz https://github.com/CSReviser/ffmpeg-build/releases/download/8.0/ffmpeg-macos-universal.tar.gz || { echo "Failed to download FFmpeg"; exit 1; }
#        tar -xzvf FFmpeg.tar.gz ffmpeg
#        cp ffmpeg ./build/CaptureStream2.app/Contents/MacOS/ 
        
    - name: Create MacCaptureStream2 directory
      run: |
          mkdir -p build/tmp/MacCaptureStream2
          mv build/CaptureStream2.app build/tmp/MacCaptureStream2/CaptureStream2-Red.app
          cp -r CaptureStream2/qss_files/License build/tmp/MacCaptureStream2/
          cp -Rp CaptureStream2/qss_files/stylesheet-mac build/tmp/MacCaptureStream2/
          cp -Rp CaptureStream2/Resources/icons build/tmp/MacCaptureStream2/
          
    - name: Create symlink to Applications
      run: |
        ln -s /Applications ./build/tmp/MacCaptureStream2/Applications
        
    - name: Create DMG file
      run: |
          cd build
          hdiutil create -volname MacCaptureStream2 \
                      -srcfolder tmp \
                      -ov -format UDZO \
                      "CaptureStream2-Red-MacOS-Universal-${{ github.event.inputs.yyyymmdd }}.dmg"
    - name: Format release title
      id: format_date
      run: |
#        yyyy=${{ github.event.inputs.yyyymmdd }} 
#       echo "title=${yyyy:0:4}/${yyyy:4:2}/${yyyy:6:2}版リリース" >> "$GITHUB_OUTPUT"

    - name: Upload DMG to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/CaptureStream2-Red-MacOS-Universal-${{ github.event.inputs.yyyymmdd }}.dmg
        tag_name: ${{ github.event.inputs.yyyymmdd }}
        name: ${{ steps.format_date.outputs.title }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
