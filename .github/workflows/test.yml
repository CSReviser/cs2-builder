name: 0. test

on:
  workflow_dispatch:


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  win_build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/csreviser/qt6-mxe-static:6.12.0

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Mark repo as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Clone CaptureStream2
        run: |
          git clone https://github.com/CSReviser/CaptureStream2.git
          cd CaptureStream2
          git checkout feature
          git submodule update --init --recursive

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake
        run: >
          /opt/mxe/usr/x86_64-w64-mingw32.static/qt6/bin/qt-cmake
          -S CaptureStream2
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="/opt/mxe/usr/x86_64-w64-mingw32.static/qt6/bin"
          -DCMAKE_FIND_ROOT_PATH="/opt/mxe/usr/x86_64-w64-mingw32.static"
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_INSTALL_PREFIX=install
          -DQT_HOST_PATH="/opt/mxe/usr/x86_64-w64-mingw32.static/qt6"

      - name: Build
        run: cmake --build build --parallel

      - name: Create WinCaptureStream2 directory and move exe
        shell: bash
        run: |
          mkdir -p build/WinCaptureStream2
          mv build/CaptureStream2.exe build/WinCaptureStream2/
          cp ./CaptureStream2/qss_files/stylesheet-win.qss build/WinCaptureStream2/
          cp -r ./CaptureStream2/qss_files/License build/WinCaptureStream2/
          mkdir -p build/stylesheet-win
          cp -r ./CaptureStream2/qss_files/stylesheet-win build/
          cp -r ./CaptureStream2/qss_files/stylesheet-mac build/
          wget -qO ffmpeg.zip https://github.com/CSReviser/ffmpeg-build/releases/download/9.0.2/ffmpeg-9.0.2-windows-x64-static.zip
          7z e ffmpeg.zip ffmpeg.exe -o./build/WinCaptureStream2/
 #         cp /opt/mxe/usr/x86_64-w64-mingw32.static/bin/ffmpeg.exe build/WinCaptureStream2/
          
      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install -y curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
          gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
          tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install -y gh

      - name: Inspect build environment
        run: |
          echo "=== GCC ==="
          /opt/mxe/usr/bin/x86_64-w64-mingw32.static-gcc --version

          echo "=== G++ ==="
          /opt/mxe/usr/bin/x86_64-w64-mingw32.static-g++ --version

          echo "=== CMake ==="
          cmake --version

          echo "=== Qt ==="
          /opt/mxe/usr/x86_64-w64-mingw32.static/qt6/bin/qmake --version

      - name: Inspect executable
        run: |
          file build/WinCaptureStream2/CaptureStream2.exe
          objdump -f build/CaptureStream2.exe
          objdump --section-headers build/WinCaptureStream2/CaptureStream2.exe | grep -E 'debug|text'
          objdump -x build/WinCaptureStream2/CaptureStream2.exe > build/CaptureStream2-objdump.txt

